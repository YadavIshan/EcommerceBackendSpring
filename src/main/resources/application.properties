spring.application.name=EcommerceBackend
#Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.data.jpa.repositories.bootstrap-mode=default
spring.jpa.defer-datasource-initialization=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop


server.port=${PORT}

BASE_URL=${FAKESTORE_API_URL}
fakeStore.category.url=${FAKESTORE_API_URL}/products/categories
fakeStore.productsByCategory.url=${FAKESTORE_API_URL}/products/category

spring.flyway.enabled=false
spring.flyway.locations=classpath:/db/migration

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Eureka Configuration
eureka.instance.metadata-map.ami-id=local
# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

